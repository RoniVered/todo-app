<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>רשימת משימות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #12141A;
      color: #E7E9EE;
      font-family: 'Rubik', sans-serif;
    }
    .wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 32px 26px 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .stats { display: flex; gap: 10px; }
    .stat {
      display: flex; align-items: center; gap: 6px;
      background: #1B1F29; border: 1px solid #2A2F3B; border-radius: 8px;
      padding: 6px 12px;
    }
    .stat .num { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14px; }
    .stat .label { font-size: 12px; color: #9AA3B2; }
    .stat.open .num { color: #E8A33D; }
    .stat.done .num { color: #4FC7C3; }

    h1 { margin: 0; font-family: 'Heebo', sans-serif; font-weight: 800; font-size: 26px; color: #F4F5F7; }

    form {
      display: flex; gap: 10px;
      background: #1B1F29; border: 1px solid #2A2F3B; border-radius: 10px;
      padding: 6px 6px 6px 14px;
    }
    form input {
      flex-grow: 1; border: none; background: transparent; outline: none;
      font-family: 'Rubik', sans-serif; font-size: 14px; color: #E7E9EE; padding: 8px 0;
    }
    form button {
      border: none; background: #E8A33D; color: #1A1305;
      font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 13px;
      cursor: pointer; padding: 8px 16px; border-radius: 8px;
    }

    .actions { display: flex; gap: 8px; }
    .actions button {
      flex: 1; border: 1px solid #2A2F3B; background: transparent; color: #C7CCD6;
      font-family: 'Rubik', sans-serif; font-size: 12px; cursor: pointer;
      padding: 7px 6px; border-radius: 7px;
    }
    .actions button.danger { border-color: #4A2A2A; color: #E08585; }

    .list { display: flex; flex-direction: column; gap: 8px; }
    .task {
      display: flex; align-items: center; gap: 10px;
      background: #1B1F29; border-radius: 9px; padding: 12px 14px;
      border-inline-start: 3px solid #E8A33D;
    }
    .task.completed { border-inline-start-color: #4FC7C3; opacity: 0.6; }
    .task input[type="checkbox"] { width: 16px; height: 16px; accent-color: #E8A33D; }
    .task.completed input[type="checkbox"] { accent-color: #4FC7C3; }
    .task span { flex-grow: 1; font-size: 14px; }
    .task.completed span { text-decoration: line-through; }
    .task span.editable { cursor: text; }
    .task span.editable:hover { text-decoration: underline; text-decoration-style: dotted; }
    .edit-input {
      flex-grow: 1; font-family: 'Rubik', sans-serif; font-size: 14px; color: #E7E9EE;
      background: #12141A; border: 1px solid #E8A33D; border-radius: 5px;
      padding: 3px 8px; outline: none;
    }
    .icon-btn {
      border: none; background: transparent; color: #7C8494; cursor: pointer;
      padding: 4px; display: flex; align-items: center;
    }

    .deleted-header { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .deleted-header .label { font-family: 'Heebo', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.04em; color: #7C8494; }
    .deleted-header .count {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #565E6E;
      background: #1B1F29; border-radius: 5px; padding: 1px 6px;
    }
    .deleted-task {
      display: flex; align-items: center; gap: 10px;
      background: #171A21; border-radius: 9px; padding: 10px 14px;
    }
    .deleted-task span { flex-grow: 1; font-size: 13px; color: #6B7280; }
    .restore-btn {
      border: none; background: transparent; color: #E8A33D; cursor: pointer;
      padding: 4px; display: flex; align-items: center; gap: 4px; font-size: 12px;
      font-family: 'Rubik', sans-serif;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stats">
      <div class="stat open"><span class="num" id="open-count">0</span><span class="label">פתוחות</span></div>
      <div class="stat done"><span class="num" id="done-count">0</span><span class="label">הושלמו</span></div>
    </div>

    <h1>רשימת משימות</h1>

    <form id="add-form">
      <input type="text" id="title-input" placeholder="משימה חדשה..." required />
      <button type="submit">הוסף</button>
    </form>

    <div class="actions">
      <button id="mark-all-done">סמן הכל בוצע</button>
      <button id="mark-all-undone">סמן הכל פתוח</button>
      <button id="delete-all" class="danger">מחק הכל</button>
    </div>

    <div class="list" id="task-list"></div>

    <div>
      <div class="deleted-header">
        <span class="label">משימות שנמחקו</span>
        <span class="count" id="deleted-count">0</span>
      </div>
      <div class="list" id="deleted-list" style="margin-top: 8px;"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
