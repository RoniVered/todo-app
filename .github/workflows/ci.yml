name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

  build-and-smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t todo-app:ci .

      - name: Run container
        run: docker run -d -p 3000:3000 --name todo-app-ci todo-app:ci

      - name: Wait for app to respond
        run: |
          for i in $(seq 1 15); do
            if curl -s -f http://localhost:3000/tasks > /dev/null; then
              echo "App responded"
              exit 0
            fi
            sleep 2
          done
          echo "App never responded"
          docker logs todo-app-ci
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs todo-app-ci
